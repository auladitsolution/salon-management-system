<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="salonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B3A52"/>
      <stop offset="50%" stop-color="#552437"/>
      <stop offset="100%" stop-color="#2D111C"/>
    </linearGradient>
    <linearGradient id="salonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="salonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Background with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#salonBg)"/>
  
  <!-- Subtle Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#salonGold)" stroke-width="1.5" stroke-opacity="0.7"/>

  <g filter="url(#salonGlow)">
    <!-- Scissor Blades (crossing at 32, 33) -->
    <!-- Blade 1: bottom-left to top-right -->
    <path d="M 23 42 L 32 33 L 45 16 C 45 16 46 19 43 23 L 33 35 L 26 44 Z" fill="url(#salonGold)"/>
    
    <!-- Blade 2: bottom-right to top-left -->
    <path d="M 41 42 L 32 33 L 19 16 C 19 16 18 19 21 23 L 31 35 L 38 44 Z" fill="url(#salonGold)"/>

    <!-- Left Handle Loop -->
    <circle cx="21" cy="46" r="6" fill="none" stroke="url(#salonGold)" stroke-width="2.5"/>
    
    <!-- Right Handle Loop -->
    <circle cx="43" cy="46" r="6" fill="none" stroke="url(#salonGold)" stroke-width="2.5"/>

    <!-- Center Pivot Screw -->
    <circle cx="32" cy="33.5" r="2.2" fill="#FEF3C7" stroke="#92400E" stroke-width="0.8"/>

    <!-- Luxury Sparkle Top Right -->
    <path d="M 48 10 Q 48 14 52 14 Q 48 14 48 18 Q 48 14 44 14 Q 48 14 48 10 Z" fill="#FDE68A"/>

    <!-- Mini Sparkle Left -->
    <path d="M 14 26 Q 14 28.5 16.5 28.5 Q 14 28.5 14 31 Q 14 28.5 11.5 28.5 Q 14 28.5 14 26 Z" fill="#FDE68A" opacity="0.9"/>
  </g>
</svg>
